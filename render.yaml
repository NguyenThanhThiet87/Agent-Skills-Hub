services:
  - type: web
    name: synexan-agent-skills-hub
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install
    startCommand: node server/app.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: SKILLS_DIR
        value: ./skills
      # Set MONGODB_URI on Render Dashboard Environment tab
